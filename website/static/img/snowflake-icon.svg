<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Snowflake icon -->
  <defs>
    <linearGradient id="snowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Outer hexagon shape (snowflake) -->
    <path d="M 0,-40 L 35,-20 L 35,20 L 0,40 L -35,20 L -35,-20 Z"
          fill="none" stroke="url(#snowGradient)" stroke-width="2"/>

    <!-- Inner hexagon -->
    <path d="M 0,-25 L 22,-12 L 22,12 L 0,25 L -22,12 L -22,-12 Z"
          fill="none" stroke="url(#snowGradient)" stroke-width="1.5" opacity="0.6"/>

    <!-- Snowflake points (star pattern) -->
    <line x1="0" y1="-40" x2="0" y2="-50" stroke="url(#snowGradient)" stroke-width="2"/>
    <line x1="0" y1="40" x2="0" y2="50" stroke="url(#snowGradient)" stroke-width="2"/>
    <line x1="35" y1="-20" x2="45" y2="-30" stroke="url(#snowGradient)" stroke-width="2"/>
    <line x1="-35" y1="20" x2="-45" y2="30" stroke="url(#snowGradient)" stroke-width="2"/>
    <line x1="35" y1="20" x2="45" y2="30" stroke="url(#snowGradient)" stroke-width="2"/>
    <line x1="-35" y1="-20" x2="-45" y2="-30" stroke="url(#snowGradient)" stroke-width="2"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="url(#snowGradient)" opacity="0.8"/>
  </g>
</svg>
