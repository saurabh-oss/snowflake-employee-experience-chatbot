<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a18"/>
      <stop offset="100%" style="stop-color:#0d1f35"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29B5E8"/>
      <stop offset="100%" style="stop-color:#06A77D"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#050a18"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#29B5E8" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#title-grad)"/>

  <!-- Snowflake icon -->
  <text x="80" y="148" font-family="sans-serif" font-size="80" fill="#29B5E8" opacity="0.9">❄️</text>

  <!-- Badge: Open Source -->
  <rect x="80" y="172" width="130" height="30" rx="15" fill="#29B5E8" opacity="0.15"/>
  <rect x="80" y="172" width="130" height="30" rx="15" fill="none" stroke="#29B5E8" stroke-width="1" opacity="0.4"/>
  <text x="145" y="192" font-family="sans-serif" font-size="13" fill="#29B5E8" text-anchor="middle" font-weight="600">OPEN SOURCE</text>

  <!-- Badge: PoC -->
  <rect x="224" y="172" width="60" height="30" rx="15" fill="#06A77D" opacity="0.15"/>
  <rect x="224" y="172" width="60" height="30" rx="15" fill="none" stroke="#06A77D" stroke-width="1" opacity="0.4"/>
  <text x="254" y="192" font-family="sans-serif" font-size="13" fill="#06A77D" text-anchor="middle" font-weight="600">PoC</text>

  <!-- Main title -->
  <text x="80" y="290" font-family="sans-serif" font-size="72" font-weight="800" fill="url(#title-grad)">Ask EX</text>

  <!-- Subtitle -->
  <text x="80" y="350" font-family="sans-serif" font-size="28" fill="rgba(255,255,255,0.75)" font-weight="400">Employee Experience AI Chatbot</text>
  <text x="80" y="390" font-family="sans-serif" font-size="22" fill="rgba(255,255,255,0.45)" font-weight="300">on Snowflake Cortex — 100% inside your data perimeter</text>

  <!-- Divider -->
  <line x1="80" y1="428" x2="560" y2="428" stroke="#29B5E8" stroke-width="1" opacity="0.3"/>

  <!-- Feature pills -->
  <rect x="80" y="448" width="148" height="34" rx="8" fill="#0a1628" stroke="#29B5E8" stroke-width="1" opacity="0.6"/>
  <text x="154" y="470" font-family="sans-serif" font-size="13" fill="#29B5E8" text-anchor="middle" font-weight="500">Cortex Search</text>

  <rect x="242" y="448" width="158" height="34" rx="8" fill="#0a1628" stroke="#29B5E8" stroke-width="1" opacity="0.6"/>
  <text x="321" y="470" font-family="sans-serif" font-size="13" fill="#29B5E8" text-anchor="middle" font-weight="500">Cortex Analyst</text>

  <rect x="414" y="448" width="168" height="34" rx="8" fill="#0a1628" stroke="#29B5E8" stroke-width="1" opacity="0.6"/>
  <text x="498" y="470" font-family="sans-serif" font-size="13" fill="#29B5E8" text-anchor="middle" font-weight="500">Cortex COMPLETE</text>

  <!-- Chat window mockup (right side) -->
  <rect x="660" y="60" width="490" height="510" rx="16" fill="url(#card-grad)" stroke="#29B5E8" stroke-width="1" opacity="0.8"/>

  <!-- Chat header -->
  <rect x="660" y="60" width="490" height="52" rx="16" fill="#0a1628"/>
  <rect x="660" y="96" width="490" height="16" fill="#0a1628"/>
  <circle cx="698" cy="86" r="8" fill="#29B5E8" opacity="0.8"/>
  <text x="716" y="91" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.85)" font-weight="600">Ask EX</text>
  <circle cx="1118" cy="86" r="6" fill="#06A77D" opacity="0.8"/>

  <!-- Chat bubble: user -->
  <rect x="820" y="138" width="300" height="44" rx="10" fill="#29B5E8" opacity="0.15"/>
  <rect x="820" y="138" width="300" height="44" rx="10" fill="none" stroke="#29B5E8" stroke-width="1" opacity="0.3"/>
  <text x="970" y="158" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">How many leave days do I have</text>
  <text x="970" y="175" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">left this year?</text>

  <!-- Chat bubble: bot -->
  <rect x="680" y="204" width="340" height="80" rx="10" fill="#0d1f35" stroke="#29B5E8" stroke-width="1" opacity="0.4"/>
  <text x="700" y="224" font-family="sans-serif" font-size="12" fill="#29B5E8" font-weight="600">Ask EX</text>
  <text x="700" y="244" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">You have 9 days of Annual Leave</text>
  <text x="700" y="262" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">remaining, including 2 pre-approved.</text>
  <text x="700" y="278" font-family="sans-serif" font-size="11" fill="#06A77D">✓ Verified from Snowflake</text>

  <!-- Chat bubble: user 2 -->
  <rect x="820" y="306" width="300" height="44" rx="10" fill="#29B5E8" opacity="0.15"/>
  <rect x="820" y="306" width="300" height="44" rx="10" fill="none" stroke="#29B5E8" stroke-width="1" opacity="0.3"/>
  <text x="970" y="326" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">What's the remote work policy</text>
  <text x="970" y="343" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">for my team?</text>

  <!-- Chat bubble: bot 2 -->
  <rect x="680" y="372" width="340" height="80" rx="10" fill="#0d1f35" stroke="#29B5E8" stroke-width="1" opacity="0.4"/>
  <text x="700" y="392" font-family="sans-serif" font-size="12" fill="#29B5E8" font-weight="600">Ask EX</text>
  <text x="700" y="412" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">Engineering teams may work remotely</text>
  <text x="700" y="430" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.75)">up to 3 days/week per Policy v2.1.</text>
  <text x="700" y="446" font-family="sans-serif" font-size="11" fill="#06A77D">✓ Source: HR Policy Docs</text>

  <!-- Input bar -->
  <rect x="680" y="504" width="450" height="46" rx="23" fill="#0a1628" stroke="#29B5E8" stroke-width="1" opacity="0.5"/>
  <text x="710" y="532" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">Ask anything about HR, IT, leave...</text>

  <!-- Bottom: URL -->
  <text x="80" y="590" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.3)">github.com/saurabh-oss/snowflake-employee-experience-chatbot</text>
</svg>
